{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h2>Edit Trek</h2>

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">Trek Name</label>
            <input type="text"
                   class="form-control"
                   name="trek_name"
                   value="{{ trek.trek_name }}"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Location</label>
            <input type="text"
                   class="form-control"
                   name="location"
                   value="{{ trek.location }}"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Duration (Days)</label>
            <input type="number"
                   class="form-control"
                   name="duration"
                   value="{{ trek.duration }}"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Difficulty</label>

            <select class="form-select" name="difficulty">

                <option value="Easy" {% if trek.difficulty=="Easy" %}selected{% endif %}>Easy</option>

                <option value="Moderate" {% if trek.difficulty=="Moderate" %}selected{% endif %}>Moderate</option>

                <option value="Hard" {% if trek.difficulty=="Hard" %}selected{% endif %}>Hard</option>

            </select>

        </div>

        <div class="mb-3">
            <label class="form-label">Price</label>
            <input type="number"
                   class="form-control"
                   name="price"
                   value="{{ trek.price }}"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Start Date</label>
            <input type="date"
                   class="form-control"
                   name="start_date"
                   value="{{ trek.start_date }}"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">End Date</label>
            <input type="date"
                   class="form-control"
                   name="end_date"
                   value="{{ trek.end_date }}"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Available Slots</label>
            <input type="number"
                   class="form-control"
                   name="available_slots"
                   value="{{ trek.available_slots }}"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Description</label>

            <textarea class="form-control"
                      name="description"
                      rows="4">{{ trek.description }}</textarea>

        </div>

        <div class="mb-3">
            <label class="form-label">Status</label>

            <select class="form-select" name="status">

                <option value="Open" {% if trek.status=="Open" %}selected{% endif %}>Open</option>

                <option value="Closed" {% if trek.status=="Closed" %}selected{% endif %}>Closed</option>

            </select>

        </div>

        <div class="mb-3">
            <label class="form-label">Assigned Staff</label>

            <select class="form-select" name="assigned_staff_id">

                <option value="">No Staff Assigned</option>

                {% for staff in staff_members %}

                <option value="{{ staff.user_id }}"
                    {% if trek.assigned_staff_id == staff.user_id %}selected{% endif %}>

                    {{ staff.name }}

                </option>

                {% endfor %}

            </select>

        </div>

        <button class="btn btn-primary">
            Save Changes
        </button>

        <a href="/admin/treks" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
